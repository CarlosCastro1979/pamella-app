<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PAMELLA">
<meta name="description" content="PAMELLA Personal App - Gestão de aulas de personal trainer">
<title>PAMELLA Personal App</title>
<!-- build: 20260429_005041 -->
<link rel="manifest" href="/pamella-app/manifest.json">
<link rel="apple-touch-icon" href="/pamella-app/icon-192.png">
<link rel="icon" type="image/png" href="/pamella-app/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f3ff;
  --bg2:#ffffff;
  --bg3:#ede9fe;
  --card:#ffffff;
  --card2:#f5f3ff;
  --accent:#7c3aed;
  --accent2:#a855f7;
  --pink:#db2777;
  --text:#1e1333;
  --text2:#3b2a6e;
  --text3:#7c6faa;
  --green:#059669;
  --green-bg:#d1fae5;
  --red:#dc2626;
  --red-bg:#fee2e2;
  --amber:#b45309;
  --amber-bg:#fef3c7;
  --border:#ddd6fe;
  --border2:#c4b5fd;
  --radius:16px;
  --shadow:0 2px 12px rgba(124,58,237,0.1);
  --font:'Outfit',sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px}
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}

.header{background:linear-gradient(135deg,#6d28d9 0%,#7c3aed 50%,#9333ea 100%);padding:14px 16px 12px;display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:0 2px 16px rgba(109,40,217,0.4)}
.header-avatar{width:46px;height:46px;border-radius:50%;border:2.5px solid rgba(255,255,255,0.7);object-fit:cover;flex-shrink:0}
.header-info h1{font-size:18px;font-weight:800;color:#ffffff;letter-spacing:-0.3px}
.header-info p{font-size:12px;color:rgba(255,255,255,0.75);margin-top:1px}
.header-month{margin-left:auto}
.header-month select{background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.5);color:#ffffff;font-family:var(--font);font-size:13px;font-weight:600;padding:6px 12px;border-radius:20px;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none}
.header-month select option{background:#6d28d9;color:#ffffff;font-weight:500}

.nav{display:flex;background:#ffffff;border-top:1.5px solid var(--border);flex-shrink:0;box-shadow:0 -2px 12px rgba(124,58,237,0.08)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px 10px;cursor:pointer;position:relative;transition:all 0.2s;background:none;border:none;color:var(--text3);font-family:var(--font)}
.nav-btn.active{color:var(--accent)}
.nav-btn.active::before{content:'';position:absolute;top:0;left:25%;right:25%;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:0 0 4px 4px}
.nav-icon{font-size:22px;margin-bottom:2px}
.nav-label{font-size:10px;font-weight:600;letter-spacing:0.3px}

.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;display:none;background:var(--bg)}
.content.active{display:block}

.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all 0.18s}
.btn:active{transform:scale(0.96)}
.btn-primary{background:linear-gradient(135deg,#6d28d9,#9333ea);color:#fff;box-shadow:0 4px 14px rgba(109,40,217,0.35)}
.btn-success{background:linear-gradient(135deg,#047857,#059669);color:#fff}
.btn-danger{background:linear-gradient(135deg,#b91c1c,#dc2626);color:#fff}
.btn-ghost{background:var(--bg3);color:var(--accent);border:1.5px solid var(--border2)}
.btn-warning{background:linear-gradient(135deg,#92400e,#b45309);color:#fff}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px}
.btn-full{width:100%;display:flex}

.input-group{margin-bottom:14px}
.input-label{font-size:12px;color:var(--text2);font-weight:700;margin-bottom:6px;display:block;letter-spacing:0.2px}
.input{width:100%;background:#ffffff;border:1.5px solid var(--border2);border-radius:10px;padding:11px 14px;color:var(--text);font-family:var(--font);font-size:14px;font-weight:500;outline:none;transition:border-color 0.2s,box-shadow 0.2s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,0.12)}
.input::placeholder{color:#a78bfa;font-weight:400}
select.input{cursor:pointer;color:var(--text)}
select.input option{color:var(--text);background:#fff;font-weight:500}

.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.aula-musculacao{border-left:4px solid #e74c3c!important;background:linear-gradient(90deg,#fdf0ef 0%,var(--card) 50%)!important}
.aula-natacao{border-left:4px solid #2980b9!important;background:linear-gradient(90deg,#eaf4fb 0%,var(--card) 50%)!important}
.aula-outro{border-left:4px solid #8e44ad!important;background:linear-gradient(90deg,#f5eef8 0%,var(--card) 50%)!important}
.tipo-badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;margin-left:4px}
.tipo-musc{background:#fde8e8;color:#c0392b}
.tipo-nat{background:#d6eaf8;color:#1a6fa0}
.tipo-out{background:#e8daef;color:#6c3483}
.mensalidade-badge{background:#e8f8f0;color:#1e8449;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}

.client-item{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.18s;box-shadow:var(--shadow)}
.client-item:active{background:var(--bg3)}
.client-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0;color:#fff}
.client-info h3{font-size:15px;font-weight:700;color:var(--text)}
.client-info p{font-size:12px;color:var(--text3);margin-top:2px;font-weight:500}
.client-value{margin-left:auto;text-align:right}
.client-value .amount{font-size:16px;font-weight:800;color:var(--green)}
.client-value .classes{font-size:11px;color:var(--text3);font-weight:500}

.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav-btn{background:var(--bg3);border:1.5px solid var(--border2);color:var(--accent);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;transition:all 0.15s}
.cal-title{font-size:16px;font-weight:800;color:var(--text)}
.cal-days-header{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:6px}
.cal-days-header span{font-size:11px;font-weight:700;color:var(--text3);padding:4px 0;text-transform:uppercase;letter-spacing:0.3px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;position:relative;font-size:13px;font-weight:600;transition:all 0.15s;color:var(--text);border:1.5px solid transparent}
.cal-day:active{transform:scale(0.9)}
.cal-day.empty{opacity:0;pointer-events:none}
.cal-day.today{border-color:var(--accent);color:var(--accent);background:rgba(124,58,237,0.07)}
.cal-day.has-class::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--pink)}
.cal-day.selected{background:linear-gradient(135deg,#6d28d9,#9333ea);color:#fff!important;border-color:transparent;box-shadow:0 3px 10px rgba(109,40,217,0.4)}
.cal-day:hover:not(.empty):not(.selected){background:var(--bg3)}

.session-item{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.session-item.done-item{background:var(--bg3);border-color:rgba(5,150,105,0.3)}
.session-time{font-size:15px;font-weight:800;color:var(--accent);min-width:48px}
.session-client{flex:1;min-width:0}
.session-client h4{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-client p{font-size:11px;color:var(--text3);font-weight:500}
.session-actions{display:flex;gap:5px;flex-shrink:0}

.modal-overlay{position:fixed;inset:0;background:rgba(30,19,51,0.55);z-index:1000;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal{background:#ffffff;border-radius:24px 24px 0 0;padding:20px 20px 32px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;border-top:2px solid var(--border);animation:slideUp 0.28s ease-out;box-shadow:0 -8px 40px rgba(109,40,217,0.2)}
.modal-handle{width:44px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:19px;font-weight:800;color:var(--text);margin-bottom:16px}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}

.summary-item{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.summary-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.summary-name{font-size:15px;font-weight:800;color:var(--text)}
.summary-total{font-size:19px;font-weight:800;color:var(--green)}
.summary-detail{border-top:1.5px solid var(--border);margin-top:12px;padding-top:12px;display:none}
.summary-detail.open{display:block}
.summary-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;font-weight:500;color:var(--text2);border-bottom:1px solid var(--border)}
.summary-row:last-child{border:none}

.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.stat-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat-value{font-size:20px;font-weight:800;color:var(--accent)}
.stat-label{font-size:10px;color:var(--text3);font-weight:700;margin-top:2px;text-transform:uppercase;letter-spacing:0.4px}

.recurrence-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.day-pill{padding:9px 4px;text-align:center;border-radius:8px;border:1.5px solid var(--border2);font-size:11px;font-weight:700;cursor:pointer;transition:all 0.15s;background:#fff;color:var(--text2)}
.day-pill.selected{background:linear-gradient(135deg,#6d28d9,#9333ea);color:#fff;border-color:transparent}

.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;border-radius:12px;padding:10px 20px;font-size:13px;font-weight:700;z-index:2000;animation:fadeToast 3s ease forwards;white-space:nowrap;box-shadow:0 8px 24px rgba(30,19,51,0.3)}
@keyframes fadeToast{0%{opacity:0;top:66px}10%{opacity:1;top:76px}70%{opacity:1}100%{opacity:0}}

.time-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.warning-box{background:var(--amber-bg);border:1.5px solid #fcd34d;border-radius:10px;padding:11px 13px;margin-bottom:14px;font-size:13px;color:var(--amber);font-weight:600}
.section-title{font-size:19px;font-weight:800;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.av-0{background:linear-gradient(135deg,#6d28d9,#9333ea)}
.av-1{background:linear-gradient(135deg,#0e7490,#06b6d4)}
.av-2{background:linear-gradient(135deg,#be185d,#ec4899)}
.av-3{background:linear-gradient(135deg,#047857,#10b981)}
.av-4{background:linear-gradient(135deg,#b45309,#f59e0b)}
.av-5{background:linear-gradient(135deg,#1d4ed8,#3b82f6)}
.av-6{background:linear-gradient(135deg,#9f1239,#f43f5e)}
.av-7{background:linear-gradient(135deg,#134e4a,#14b8a6)}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state .ei{font-size:48px;margin-bottom:12px;display:block}
.empty-state p{font-size:14px;font-weight:500;line-height:1.6}

/* Install banner */
#installBanner{display:none;background:linear-gradient(135deg,#6d28d9,#9333ea);color:#fff;padding:12px 16px;align-items:center;gap:10px;flex-shrink:0}
#installBanner p{font-size:13px;font-weight:600;flex:1}
#installBanner .ib-btn{background:rgba(255,255,255,0.25);border:1.5px solid rgba(255,255,255,0.5);color:#fff;font-family:var(--font);font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;cursor:pointer}
#installBanner .ib-x{background:none;border:none;color:rgba(255,255,255,0.7);font-size:18px;cursor:pointer;padding:0 4px}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

@media print{
  .nav,.header-month,.btn,.modal-overlay,.session-actions,#installBanner{display:none!important}
  body,#app{background:white;height:auto;overflow:visible}
  .content{display:block!important;overflow:visible}
  .summary-detail{display:block!important}
}
</style>
</head>

      <button class="btn btn-ghost btn-sm" id="btnViewStudent" onclick="setSummaryView('student')" style="flex:1">📋 Por Aluno</button>
    </div>
    <div id="summaryContent"></div>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="switchTab('calendar',this)"><span class="nav-icon">📅</span><span class="nav-label">Agenda</span></button>
    <button class="nav-btn" onclick="switchTab('clients',this)"><span class="nav-icon">👥</span><span class="nav-label">Alunos</span></button>
    <button class="nav-btn" onclick="switchTab('summary',this)"><span class="nav-icon">💰</span><span class="nav-label">Resumo</span></button>
  </div>
</div>

<div id="modalOverlay" style="display:none" class="modal-overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div id="modalInner"></div>
  </div>
</div>

<script>
const STORE_KEY='pamella_v2';
let db={clients:[],sessions:[],currentMonth:new Date().toISOString().slice(0,7)};
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(db))}
function load(){const d=localStorage.getItem(STORE_KEY);if(d)try{db=JSON.parse(d)}catch(e){}}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

// PWA Install
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  document.getElementById('installBanner').style.display='flex';
});
window.addEventListener('appinstalled',()=>{
  document.getElementById('installBanner').style.display='none';
  showToast('✅ App instalada com sucesso!');
});
function installApp(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById('installBanner').style.display='none'});}
}

function initMonthSelector(){
  const sel=document.getElementById('globalMonth');sel.innerHTML='';
  const now=new Date();
  for(let i=-3;i<=4;i++){
    const d=new Date(now.getFullYear(),now.getMonth()+i,1);
    const val=d.toISOString().slice(0,7);
    const label=d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    const opt=document.createElement('option');
    opt.value=val;opt.textContent=label.charAt(0).toUpperCase()+label.slice(1);
    if(val===db.currentMonth)opt.selected=true;
    sel.appendChild(opt);
  }
}
function onMonthChange(){db.currentMonth=document.getElementById('globalMonth').value;save();renderCalendar();renderSummary();renderDaySessions(selectedDate)}

let selectedDate=new Date().toISOString().slice(0,10);
let calViewDate=new Date();

function renderCalendar(){
  const C=document.getElementById('calendarWidget');
  const y=calViewDate.getFullYear(),m=calViewDate.getMonth();
  const today=new Date().toISOString().slice(0,10);
  const fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  const mn=calViewDate.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const sd=new Set();
  db.sessions.forEach(s=>{if(s.date&&s.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`))sd.add(s.date)});
  let h=`<div class="cal-header">
    <button class="cal-nav-btn" onclick="calPrev()">‹</button>
    <span class="cal-title">${mn.charAt(0).toUpperCase()+mn.slice(1)}</span>
    <button class="cal-nav-btn" onclick="calNext()">›</button>
  </div>
  <div class="cal-days-header">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<span>${d}</span>`).join('')}</div>
  <div class="cal-grid">`;
  for(let i=0;i<fd;i++)h+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cl=['cal-day',ds===today?'today':'',ds===selectedDate?'selected':'',sd.has(ds)?'has-class':''].filter(Boolean).join(' ');
    h+=`<div class="${cl}" onclick="selectDate('${ds}')">${d}</div>`;
  }
  h+='</div>';C.innerHTML=h;renderDaySessions(selectedDate);
}
function calPrev(){calViewDate=new Date(calViewDate.getFullYear(),calViewDate.getMonth()-1,1);renderCalendar()}
function calNext(){calViewDate=new Date(calViewDate.getFullYear(),calViewDate.getMonth()+1,1);renderCalendar()}
function selectDate(d){selectedDate=d;const ym=d.slice(0,7);if(ym!==db.currentMonth){db.currentMonth=ym;document.getElementById('globalMonth').value=ym;}renderCalendar()}

function renderDaySessions(date){
  const cont=document.getElementById('daySessionsContainer');
  if(!date){cont.innerHTML='';return}
  const sessions=db.sessions.filter(s=>s.date===date).sort((a,b)=>a.time.localeCompare(b.time));
  const fd=new Date(date+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  let h=`<div style="font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">${fd}</div>`;
  if(!sessions.length){h+=`<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px;font-weight:500;background:var(--card);border:1.5px solid var(--border);border-radius:12px">Sem aulas neste dia</div>`}
  else sessions.forEach(s=>{
    const c=db.clients.find(x=>x.id===s.clientId),nm=c?c.name:'—';
    const te=s.timeEnd?`–${s.timeEnd}`:'';const tc=s.tipoAula==='musculacao'?'aula-musculacao':s.tipoAula==='natacao'?'aula-natacao':s.tipoAula==='outro'?'aula-outro':'';
    const tb=s.tipoAula==='musculacao'?'<span class="tipo-badge tipo-musc">💪</span>':s.tipoAula==='natacao'?'<span class="tipo-badge tipo-nat">🏊</span>':s.tipoAula==='outro'?`<span class="tipo-badge tipo-out">📋 ${s.tipoAulaCustom||'Outro'}</span>`:'';
    h+=`<div class="session-item ${s.done?'done-item':''} ${tc}">
      <div class="session-time">${s.time}${te}</div>
      <div class="session-client"><h4>${nm}${tb}</h4><p>${s.tipoAula?`${s.tipoAula==='musculacao'?'💪 Musculação':s.tipoAula==='natacao'?'🏊 Natação':s.tipoAula==='outro'?`📋 ${s.tipoAulaCustom||'Outro'}`:''}  ·  `:''}${c?.billingType==='mensalidade'?`Mensalidade R$${(c?.price||0).toFixed(0)} (${c?.freq||'1x'}/sem)`:`R$ ${(c?.price||0).toFixed(2).replace('.',',')} / aula`}${s.recurring?' · Recorrente':''}</p></div>
      <div class="session-actions">
        ${!s.done?`<button class="btn btn-success btn-sm" onclick="markDone('${s.id}')">✓</button>`:`<span class="badge badge-green">✓ OK</span>`}
        <button class="btn btn-ghost btn-sm" onclick="editSession('${s.id}')">✎</button>
        <button class="btn btn-danger btn-sm" onclick="deleteSession('${s.id}')">✕</button>
      </div>
    </div>`;
  });
  cont.innerHTML=h;
}
function markDone(id){const s=db.sessions.find(x=>x.id===id);if(s){s.done=!s.done;save();renderDaySessions(selectedDate);renderSummary();showToast(s.done?'✅ Aula realizada!':'↩ Aula desmarcada')}}
function deleteSession(id){if(!confirm('Eliminar esta aula?'))return;db.sessions=db.sessions.filter(x=>x.id!==id);save();renderCalendar();renderSummary();showToast('🗑️ Aula eliminada')}

function openNewSession(date,clientId){
  const d=date||selectedDate;
  const co=db.clients.map(c=>`<option value="${c.id}" ${clientId===c.id?'selected':''}>${c.name}</option>`).join('');
  document.getElementById('modalInner').innerHTML=`
    <div class="modal-title">📅 Nova Aula</div>
    <div class="input-group"><label class="input-label">Aluno</label>
    <select class="input" id="nsClient">${co||'<option value="">— Cria um aluno primeiro —</option>'}</select></div>
    <div class="input-group"><label class="input-label">Data</label><input type="date" class="input" id="nsDate" value="${d}"></div>
    <div class="time-row">
      <div class="input-group"><label class="input-label">Hora início</label><input type="time" class="input" id="nsTime" value="07:00" onchange="autoEndTime()"></div>
      <div class="input-group"><label class="input-label">Hora fim</label><input type="time" class="input" id="nsTimeEnd" value="08:00"></div>
    </div>
    <div class="input-group"><label class="input-label">Tipo de aula</label>
    <select class="input" id="nsType" onchange="toggleRecurrence()">
      <option value="single">Avulso (uma vez)</option>
      <option value="recurring">Recorrente (semanal)</option>
    </select></div>
    <div id="recurrenceBlock" style="display:none">
      <div class="input-group"><label class="input-label">Repetir nos dias:</label>
      <div class="recurrence-grid">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map((d,i)=>`<div class="day-pill" data-day="${i}" onclick="toggleDay(this)">${d}</div>`).join('')}</div></div>
      <div class="input-group"><label class="input-label">Até à data</label><input type="date" class="input" id="nsUntil"></div>
    </div>
    <div class="input-group"><label class="input-label">Tipo de aula</label>
      <select class="input" id="nsTipoAula" onchange="toggleTipoCustom()">
        <option value="">— Selecionar —</option>
        <option value="musculacao">💪 Musculação</option>
        <option value="natacao">🏊 Natação</option>
        <option value="outro">📋 Outro</option>
      </select></div>
    <div id="tipoCustomBox" style="display:none" class="input-group">
      <label class="input-label">Qual tipo de aula?</label>
      <input type="text" class="input" id="nsTipoCustom" placeholder="Ex: Esgrima, Pilates, Funcional..."></div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn btn-ghost" onclick="closeModal()" style="flex:1">Cancelar</button>
      <button class="btn btn-primary" onclick="saveSession()" style="flex:1">Guardar</button>
    </div>`;
  const now=new Date(),eom=new Date(now.getFullYear(),now.getMonth()+1,0).toISOString().slice(0,10);
  setTimeout(()=>{const el=document.getElementById('nsUntil');if(el)el.value=eom},50);
  showModal();
}
function toggleRecurrence(){document.getElementById('recurrenceBlock').style.display=document.getElementById('nsType').value==='recurring'?'block':'none'}
function toggleDay(el){el.classList.toggle('selected')}

function toggleTipoCustom(){
  const v=document.getElementById('nsTipoAula')?.value;
  const box=document.getElementById('tipoCustomBox');
  if(box) box.style.display=v==='outro'?'block':'none';
}
function autoEndTime(){
  const s=document.getElementById('nsTime')?.value;if(!s)return;
  const [h,m]=s.split(':').map(Number);
  const el=document.getElementById('nsTimeEnd');
  if(el)el.value=`${String((h+1)%24).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function saveSession(){
  const cid=document.getElementById('nsClient')?.value,date=document.getElementById('nsDate').value,time=document.getElementById('nsTime').value,timeEnd=document.getElementById('nsTimeEnd')?.value||'',type=document.getElementById('nsType').value;
  if(!cid||!date||!time){showToast('⚠️ Preenche todos os campos');return}
  if(type==='single'){
    const cf=db.sessions.find(s=>s.date===date&&s.time===time&&s.clientId!==cid);
    if(cf){const o=db.clients.find(c=>c.id===cf.clientId);if(!confirm(`⚠️ Já existe aula às ${time} com ${o?.name||'outro aluno'}.
Agendar mesmo assim?`))return}
    const ta=document.getElementById('nsTipoAula')?.value||'';
    const taC=ta==='outro'?(document.getElementById('nsTipoCustom')?.value||''):'';
    db.sessions.push({id:genId(),clientId:cid,date,time,timeEnd,tipoAula:ta,tipoAulaCustom:taC,done:false,recurring:false});
    showToast('✅ Aula agendada!');
  }else{
    const days=[...document.querySelectorAll('.day-pill.selected')].map(el=>+el.dataset.day);
    const until=document.getElementById('nsUntil').value;
    if(!days.length){showToast('⚠️ Seleciona pelo menos um dia');return}
    if(!until){showToast('⚠️ Indica a data final');return}
    let cur=new Date(date+'T12:00:00'),end=new Date(until+'T12:00:00'),cnt=0;
    window._cfOk=false;
    while(cur<=end&&cnt<500){
      if(days.includes(cur.getDay())){
        const ds=cur.toISOString().slice(0,10);
        const cf=db.sessions.find(s=>s.date===ds&&s.time===time&&s.clientId!==cid);
        if(cf&&!window._cfOk){const o=db.clients.find(c=>c.id===cf.clientId);if(!confirm(`⚠️ Conflito em ${ds} às ${time} com ${o?.name}.
Agendar em todos os conflitos?`)){closeModal();return}window._cfOk=true}
        if(!db.sessions.find(s=>s.date===ds&&s.time===time&&s.clientId===cid)){
          const taR=document.getElementById('nsTipoAula')?.value||'';
          const taCR=taR==='outro'?(document.getElementById('nsTipoCustom')?.value||''):'';
          db.sessions.push({id:genId(),clientId:cid,date:ds,time,timeEnd,tipoAula:taR,tipoAulaCustom:taCR,done:false,recurring:true});
        }
      }
      cur.setDate(cur.getDate()+1);cnt++;
    }
    showToast('✅ Aulas recorrentes agendadas!');
  }
  save();closeModal();renderCalendar();renderSummary();
}

function editSession(id){
  const s=db.sessions.find(x=>x.id===id);if(!s)return;
  const co=db.clients.map(c=>`<option value="${c.id}" ${s.clientId===c.id?'selected':''}>${c.name}</option>`).join('');
  document.getElementById('modalInner').innerHTML=`
    <div class="modal-title">✎ Editar Aula</div>
    ${s.done?`<div class="warning-box">⚠️ Aula já validada. Podes corrigir aqui.</div>`:''}
    <div class="input-group"><label class="input-label">Aluno</label><select class="input" id="esClient">${co}</select></div>
    <div class="input-group"><label class="input-label">Data</label><input type="date" class="input" id="esDate" value="${s.date}"></div>
    <div class="time-row">
      <div class="input-group"><label class="input-label">Hora início</label><input type="time" class="input" id="esTime" value="${s.time}" onchange="autoEndTimeEdit()"></div>
      <div class="input-group"><label class="input-label">Hora fim</label><input type="time" class="input" id="esTimeEnd" value="${s.timeEnd||''}"></div>
    </div>
    <div class="input-group"><label class="input-label">Estado</label>
    <select class="input" id="esDone">
      <option value="0" ${!s.done?'selected':''}>Agendada</option>
      <option value="1" ${s.done?'selected':''}>✅ Realizada</option>
    </select></div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn btn-ghost" onclick="closeModal()" style="flex:1">Cancelar</button>
      <button class="btn btn-warning" onclick="saveEditSession('${id}')" style="flex:1">Guardar</button>
    </div>`;
  showModal();
}
function autoEndTimeEdit(){
  const s=document.getElementById('esTime')?.value;if(!s)return;
  const [h,m]=s.split(':').map(Number);
  const el=document.getElementById('esTimeEnd');
  if(el&&!el.value)el.value=`${String((h+1)%24).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function saveEditSession(id){
  const s=db.sessions.find(x=>x.id===id);if(!s)return;
  s.clientId=document.getElementById('esClient').value;s.date=document.getElementById('esDate').value;s.time=document.getElementById('esTime').value;s.timeEnd=document.getElementById('esTimeEnd')?.value||'';s.done=document.getElementById('esDone').value==='1';
  save();closeModal();renderCalendar();renderSummary();showToast('✅ Aula atualizada!');
}

const AV=['av-0','av-1','av-2','av-3','av-4','av-5','av-6','av-7'];
function gi(n){return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()}

function renderClients(){
  const cont=document.getElementById('clientsList');
  if(!db.clients.length){cont.innerHTML=`<div class="empty-state"><span class="ei">👥</span><p>Nenhum aluno ainda.<br>Adiciona o primeiro!</p></div>`;return}
  const ym=db.currentMonth;
  cont.innerHTML=db.clients.map((c,i)=>{
    const done=db.sessions.filter(s=>s.clientId===c.id&&s.done&&s.date.startsWith(ym));
    const total=done.length*(c.price||0);
    const tot=db.sessions.filter(s=>s.clientId===c.id&&s.date.startsWith(ym)).length;
    return `<div class="client-item" onclick="openClientDetail('${c.id}')">
      <div class="client-avatar ${AV[i%8]}">${gi(c.name)}</div>
      <div class="client-info"><h3>${c.name}</h3><p>R$ ${(c.price||0).toFixed(2).replace('.',',')} / aula · ${tot} aulas</p></div>
      <div class="client-value"><div class="amount">R$ ${total.toFixed(2).replace('.',',')}</div><div class="classes">${done.length} realizadas</div></div>
    </div>`;
  }).join('');
}
function openNewClient(){
  document.getElementById('modalInner').innerHTML=`
    <div class="modal-title">👤 Novo Aluno</div>
    <div class="input-group"><label class="input-label">Nome do aluno</label><input type="text" class="input" id="ncName" placeholder="Ex: Carlos Castro"></div>
    <div class="input-group"><label class="input-label">Tipo de faturação</label>
      <select class="input" id="ncBillingType" onchange="toggleNewBilling()">
        <option value="aula">Por aula</option>
        <option value="mensalidade">Mensalidade</option>
      </select></div>
    <div id="ncFreqGroup" style="display:none">
      <div class="input-group"><label class="input-label">Frequência</label>
        <select class="input" id="ncFreq">
          <option value="1x">1x por semana</option>
          <option value="2x">2x por semana</option>
        </select></div></div>
    <div class="input-group"><label class="input-label" id="ncPriceLabel">Valor por aula (R$)</label>
      <input type="number" class="input" id="ncPrice" placeholder="Ex: 150" step="0.01" min="0"></div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn btn-ghost" onclick="closeModal()" style="flex:1">Cancelar</button>
      <button class="btn btn-primary" onclick="saveClient()" style="flex:1">Criar Aluno</button>
    </div>`;
  showModal();setTimeout(()=>document.getElementById('ncName')?.focus(),300);
}
function toggleNewBilling(){
  const bt=document.getElementById('ncBillingType').value;
  document.getElementById('ncFreqGroup').style.display=bt==='mensalidade'?'block':'none';
  document.getElementById('ncPriceLabel').textContent=bt==='mensalidade'?'Valor mensal (R$)':'Valor por aula (R$)';
}
function saveClient(){
  const name=document.getElementById('ncName').value.trim();
  const billingType=document.getElementById('ncBillingType').value;
  const price=parseFloat(document.getElementById('ncPrice').value)||0;
  const freq=document.getElementById('ncFreq')?.value||'';
  const tipoAulaDef=document.getElementById('ncTipoAula')?.value||'';
  if(!name){showToast('⚠️ Insere o nome do aluno');return}
  if(!price){showToast('⚠️ Define o valor');return}
  db.clients.push({id:genId(),name,price,billingType,freq,tipoAulaDef,createdAt:new Date().toISOString()});
  save();closeModal();renderClients();showToast(`✅ ${name} adicionado!`);
}
function openClientDetail(id){
  const c=db.clients.find(x=>x.id===id);if(!c)return;
  const idx=db.clients.indexOf(c),ym=db.currentMonth;
  const sessions=db.sessions.filter(s=>s.clientId===id&&s.date.startsWith(ym)).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
  const done=sessions.filter(s=>s.done);
  const isMens=c.billingType==='mensalidade';
  const total=isMens?(done.length>0?(c.price||0):0):done.length*(c.price||0);
  const rows=sessions.map(s=>{
    const fd=new Date(s.date+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:13px;color:var(--text2);font-weight:600;min-width:48px">${fd}</span>
      <span style="font-size:13px;color:var(--text2);flex:1;font-weight:500">${s.time}</span>
      ${s.done?`<span class="badge badge-green">✓ Feita</span>`:`<span class="badge badge-amber">Agendada</span>`}
      <button class="btn btn-ghost btn-sm" onclick="editSession('${s.id}')">✎</button>
    </div>`;
  }).join('');
  document.getElementById('modalInner').innerHTML=`
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
      <div class="client-avatar ${AV[idx%8]}" style="width:54px;height:54px;font-size:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff">${gi(c.name)}</div>
      <div><div class="modal-title" style="margin:0">${c.name}</div><div style="font-size:13px;color:var(--text3);font-weight:600">${c.billingType==='mensalidade'?`<span class="mensalidade-badge">Mensalidade R$${(c.price||0).toFixed(0)} (${c.freq||'1x'}/sem)</span>`:`R$ ${(c.price||0).toFixed(2).replace('.',',')} por aula`}</div></div>
    </div>
    <div class="stats-row" style="margin-bottom:14px">
      <div class="stat-card"><div class="stat-value">${sessions.length}</div><div class="stat-label">Agendadas</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--green)">${done.length}</div><div class="stat-label">Realizadas</div></div>
      <div class="stat-card"><div class="stat-value" style="font-size:15px;color:var(--green)">R$${total.toFixed(0)}</div><div class="stat-label">A cobrar</div></div>
    </div>
    <div style="max-height:200px;overflow-y:auto;margin-bottom:14px">${rows||'<p style="text-align:center;color:var(--text3);font-size:13px;padding:16px;font-weight:500">Sem aulas este mês</p>'}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" onclick="closeModal();openNewSession(selectedDate,'${id}')" style="flex:1">＋ Agendar</button>
      <button class="btn btn-ghost btn-sm" onclick="editClient('${id}')" style="flex:1">✎ Editar</button>
      <button class="btn btn-danger btn-sm" onclick="deleteClient('${id}')">✕</button>
    </div>`;
  showModal();
}
function editClient(id){
  const c=db.clients.find(x=>x.id===id);if(!c)return;
  const bt=c.billingType||'aula';
  document.getElementById('modalInner').innerHTML=`
    <div class="modal-title">✎ Editar Aluno</div>
    <div class="input-group"><label class="input-label">Nome</label><input type="text" class="input" id="ecName" value="${c.name}"></div>
    <div class="input-group"><label class="input-label">Faturação</label>
      <select class="input" id="ecBillingType" onchange="toggleEditBilling()">
        <option value="aula" ${bt==='aula'?'selected':''}>Por aula</option>
        <option value="mensalidade" ${bt==='mensalidade'?'selected':''}>Mensalidade</option>
      </select></div>
    <div id="ecFreqGroup" style="display:${bt==='mensalidade'?'block':'none'}">
      <div class="input-group"><label class="input-label">Frequência</label>
        <select class="input" id="ecFreq">
          <option value="1x" ${c.freq==='1x'?'selected':''}>1x por semana</option>
          <option value="2x" ${c.freq==='2x'?'selected':''}>2x por semana</option>
        </select></div></div>
    <div class="input-group"><label class="input-label" id="ecPriceLabel">${bt==='mensalidade'?'Valor mensal (R$)':'Valor por aula (R$)'}</label>
      <input type="number" class="input" id="ecPrice" value="${c.price||0}" step="0.01" min="0"></div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn btn-ghost" onclick="closeModal()" style="flex:1">Cancelar</button>
      <button class="btn btn-warning" onclick="saveEditClient('${id}')" style="flex:1">Guardar</button>
    </div>`;
  showModal();
}
function toggleEditBilling(){
  const bt=document.getElementById('ecBillingType').value;
  document.getElementById('ecFreqGroup').style.display=bt==='mensalidade'?'block':'none';
  document.getElementById('ecPriceLabel').textContent=bt==='mensalidade'?'Valor mensal (R$)':'Valor por aula (R$)';
}
function saveEditClient(id){
  const c=db.clients.find(x=>x.id===id);if(!c)return;
  c.name=document.getElementById('ecName').value.trim()||c.name;
  c.price=parseFloat(document.getElementById('ecPrice').value)||0;
  c.billingType=document.getElementById('ecBillingType')?.value||'aula';
  c.freq=document.getElementById('ecFreq')?.value||'';
  c.tipoAulaDef=document.getElementById('ecTipoAula')?.value||'';
  save();closeModal();renderClients();showToast('✅ Aluno atualizado!');
}
function deleteClient(id){
  if(!confirm('Eliminar aluno e todas as suas aulas?'))return;
  db.clients=db.clients.filter(x=>x.id!==id);db.sessions=db.sessions.filter(x=>x.clientId!==id);
  save();closeModal();renderClients();renderCalendar();renderSummary();showToast('🗑️ Aluno eliminado');
}

let summaryView='teacher';
function setSummaryView(v){summaryView=v;document.getElementById('btnViewTeacher').className=`btn ${v==='teacher'?'btn-primary':'btn-ghost'} btn-sm`;document.getElementById('btnViewStudent').className=`btn ${v==='student'?'btn-primary':'btn-ghost'} btn-sm`;renderSummary()}
function renderSummary(){
  const ym=db.currentMonth,mn=new Date(ym+'-01T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  let tr=0,td=0,ts=0;
  db.clients.forEach(c=>{const s=db.sessions.filter(x=>x.clientId===c.id&&x.date.startsWith(ym)),d=s.filter(x=>x.done);td+=d.length;ts+=s.length;const mens=c.billingType==='mensalidade';tr+=mens?(d.length>0?(c.price||0):0):d.length*(c.price||0)});
  document.getElementById('summaryStats').innerHTML=`
    <div class="stat-card"><div class="stat-value">${ts}</div><div class="stat-label">Agendadas</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--green)">${td}</div><div class="stat-label">Realizadas</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--accent);font-size:16px">R$${tr.toFixed(0)}</div><div class="stat-label">A cobrar</div></div>`;
  const cont=document.getElementById('summaryContent');
  if(summaryView==='teacher'){
    let h='';
    db.clients.forEach((c,i)=>{const d=db.sessions.filter(s=>s.clientId===c.id&&s.done&&s.date.startsWith(ym)),t=d.length*(c.price||0);
      h+=`<div class="client-item" style="cursor:default"><div class="client-avatar ${AV[i%8]}">${gi(c.name)}</div><div class="client-info"><h3>${c.name}</h3><p>${d.length} aula(s) realizada(s)</p></div><div class="client-value"><div class="amount">R$ ${t.toFixed(2).replace('.',',')}</div></div></div>`;
    });
    if(!h)h=`<div class="empty-state"><span class="ei">📊</span><p>Sem aulas realizadas<br>neste mês</p></div>`;
    h+=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;background:var(--bg3);border-color:var(--border2)"><span style="font-size:16px;font-weight:800;color:var(--text)">Total do mês</span><span style="font-size:22px;font-weight:800;color:var(--green)">R$ ${tr.toFixed(2).replace('.',',')}</span></div>`;
    cont.innerHTML=h;
  }else{
    // Student selector view
    const clientsWithData=db.clients.filter(c=>db.sessions.some(s=>s.clientId===c.id&&s.done&&s.date.startsWith(ym)));
    if(!clientsWithData.length){cont.innerHTML=`<div class="empty-state"><span class="ei">📊</span><p>Sem aulas realizadas este mês</p></div>`;return;}
    let h=`<div class="input-group"><label class="input-label">Selecionar aluno</label><select class="input" id="summaryClientSel" onchange="renderStudentDetail()"><option value="">— Escolhe um aluno —</option>${db.clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div id="studentDetailArea"></div>`;
    cont.innerHTML=h;
    if(window._lastSummaryClient)document.getElementById('summaryClientSel').value=window._lastSummaryClient;
    renderStudentDetail();
  }
}

function renderStudentDetail(){
  const sel=document.getElementById('summaryClientSel');
  if(!sel)return;
  const cid=sel.value;
  window._lastSummaryClient=cid;
  const area=document.getElementById('studentDetailArea');
  if(!cid){area.innerHTML='';return;}
  const c=db.clients.find(x=>x.id===cid);
  if(!c){area.innerHTML='';return;}
  const ym=db.currentMonth;
  const done=db.sessions.filter(s=>s.clientId===cid&&s.done&&s.date.startsWith(ym)).sort((a,b)=>a.date.localeCompare(b.date));
  const total=done.length*(c.price||0);
  const mn=new Date(ym+'-01T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const cap=mn.charAt(0).toUpperCase()+mn.slice(1);
  if(!done.length){area.innerHTML=`<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px;font-weight:500">Sem aulas realizadas este mês</div>`;return;}
  const rows=done.map(s=>{
    const fd=new Date(s.date+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
    const horario=s.timeEnd?`${s.time}–${s.timeEnd}`:s.time;
    return `<div class="summary-row"><span>${fd} · ${horario}</span><span style="font-weight:700">R$ ${(c.price||0).toFixed(2).replace('.',',')}</span></div>`;
  }).join('');
  // Build WhatsApp message
  const waLines=done.map(s=>{
    const fd=new Date(s.date+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
    const horario=s.timeEnd?`${s.time}–${s.timeEnd}`:s.time;
    return `• ${fd} ${horario} — R$ ${(c.price||0).toFixed(2).replace('.',',')}`;
  }).join('\n');
  const waMsg=encodeURIComponent(`*PAMELLA Personal App*\n*${cap}*\n\nOlá ${c.name}! 😊\n\nResumo das tuas aulas:\n\n${waLines}\n\n*Total: R$ ${total.toFixed(2).replace('.',',')}*\n\nObrigada! 💪`);
  area.innerHTML=`
    <div class="card" style="margin-top:0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div><div style="font-size:16px;font-weight:800;color:var(--text)">${c.name}</div><div style="font-size:12px;color:var(--text3);font-weight:500">${cap}</div></div>
        <div class="summary-total">R$ ${total.toFixed(2).replace('.',',')}</div>
      </div>
      <div style="font-size:12px;color:var(--text3);font-weight:600;margin-bottom:8px">${done.length} aula(s) × R$ ${(c.price||0).toFixed(2).replace('.',',')}</div>
      <div style="border-top:1.5px solid var(--border);padding-top:10px">${rows}</div>
      <div style="display:flex;justify-content:space-between;padding:10px 0 4px;font-size:15px;font-weight:800;color:var(--green)"><span>Total a pagar</span><span>R$ ${total.toFixed(2).replace('.',',')}</span></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <a href="https://wa.me/?text=${waMsg}" target="_blank" class="btn btn-success btn-full" style="text-decoration:none;flex:1">💬 Enviar via WhatsApp</a>
      <button class="btn btn-ghost btn-sm" onclick="window.print()">🖨️</button>
    </div>`;
}
function showModal(){document.getElementById('modalOverlay').style.display='flex'}
function closeModal(e){if(!e||e.target===document.getElementById('modalOverlay'))document.getElementById('modalOverlay').style.display='none'}
function switchTab(n,btn){
  document.querySelectorAll('.content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+n).classList.add('active');btn.classList.add('active');
  if(n==='clients')renderClients();if(n==='summary'){setSummaryView(summaryView);renderSummary();}if(n==='calendar')renderCalendar();
}
function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}

function init(){
  load();initMonthSelector();renderCalendar();
  // Unregister any old service workers to force fresh loads
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(regs=>{
      regs.forEach(r=>r.unregister());
    });
    // Clear all caches
    if('caches' in window){
      caches.keys().then(keys=>keys.forEach(k=>caches.delete(k)));
    }
  }
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
